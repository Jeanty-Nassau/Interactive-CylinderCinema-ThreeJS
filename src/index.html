<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Signal Theatre — a rotating four-screen Three.js cinema using the original project media.">
  <title>Signal Theatre — Rotating Cinema</title>
</head>
<body>
  <main class="study-shell">
    <section class="study-copy">
      <p class="eyebrow">THREE.JS STUDY / 02</p>
      <h1>Signal <span>Theatre</span></h1>
      <p>A rotating four-screen cinema built from the original media assets, curved geometry, a textured reflective floor, and a viewer positioned in the middle of the room.</p>
      <p class="hint">Move screen to screen · Zoom in or out.</p>
    </section>

    <div id="canvasContainer">
      <canvas class="webgl" aria-label="Interactive rotating cylindrical cinema"></canvas>
    </div>

    <aside class="controls-panel" aria-label="Cinema controls">
      <button type="button" data-prev-screen>← Prev</button>
      <strong data-screen-label>Building</strong>
      <button type="button" data-next-screen>Next →</button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" data-zoom-in>Zoom +</button>
      <button type="button" data-zoom-out>Zoom −</button>
    </aside>

    <video id="video1" src="../static/castleGif.mp4" crossorigin="anonymous" playsinline preload="auto" muted loop hidden></video>
    <video id="video2" src="../static/houseGif.mp4" crossorigin="anonymous" playsinline preload="auto" muted loop hidden></video>
    <video id="video3" src="../static/sky2Gif.mp4" crossorigin="anonymous" playsinline preload="auto" muted loop hidden></video>
  </main>
</body>
</html>
